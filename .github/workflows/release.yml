# Publishes a GitHub release: the script must compile and answer --help on a clean Linux runner first, and the page
# is release-notes/<tag>/page.md (both tracks in full, plain language first). A tag v* publishes that tag; run by
# hand (workflow_dispatch) with a tag that does not exist yet, it publishes the commit it runs on and creates the tag
# there.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "the version to publish, e.g. v1.0.0 (created on this commit)"
        required: true
env:
  TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the script compiles and answers
        run: |
          python -m py_compile dual_track.py
          python dual_track.py --help
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f "release-notes/$TAG/page.md"
          if [ "$GITHUB_REF_TYPE" = tag ]; then where=--verify-tag; else where="--target $GITHUB_SHA"; fi
          gh release create "$TAG" --title "dual-track-doc-generator $TAG" \
            --notes-file "release-notes/$TAG/page.md" $where dual_track.py
